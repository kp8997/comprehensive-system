syntax = "proto3";

package ats;

// The ATS service definition.
service AtsService {
  // Check if a member is a recruiter
  rpc CheckRecruiter (CheckRecruiterRequest) returns (CheckRecruiterResponse) {}
}

// The request message containing the member's ID.
message CheckRecruiterRequest {
  string member_id = 1;
}

// The response message containing the boolean result.
message CheckRecruiterResponse {
  bool is_recruiter = 1;
}
